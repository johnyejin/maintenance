<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>항공안전 기출 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1419;
    --panel: #161d24;
    --card: #1b232c;
    --card-hover: #1f2933;
    --border: #2a3541;
    --text: #e3e8ee;
    --muted: #8b98a7;
    --accent: #5aa9e6;
    --correct: #3ecf8e;
    --correct-bg: rgba(62, 207, 142, 0.12);
    --note: #e8b04b;
    --note-bg: rgba(232, 176, 75, 0.1);
    --ch1: #f2784b;
    --ch2: #5aa9e6;
    --ch3: #b383e8;
    --sidebar-w: 270px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'IBM Plex Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 15px;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    z-index: 100;
    transition: transform 0.25s ease;
  }
  .sidebar-title {
    font-size: 18px;
    font-weight: 700;
    padding: 0 10px 4px;
  }
  .sidebar-sub {
    font-size: 12px;
    color: var(--muted);
    padding: 0 10px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .home-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .home-btn:hover { background: var(--card-hover); border-color: var(--accent); }
  .nav-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    padding: 4px 10px 6px;
  }
  .nav-link {
    display: block;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: background 0.15s, color 0.15s;
  }
  .nav-link:hover { background: var(--card); color: var(--text); }
  .nav-link.active { background: var(--card); color: var(--text); font-weight: 600; }
  .nav-link[data-ch="1"].active { border-left-color: var(--ch1); }
  .nav-link[data-ch="2"].active { border-left-color: var(--ch2); }
  .nav-link[data-ch="3"].active { border-left-color: var(--ch3); }
  .nav-num { font-size: 12px; opacity: 0.7; margin-right: 6px; }
  .nav-count { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }

  .toggle-wrap {
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .toggle-btn {
    width: 100%;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .toggle-btn:hover { border-color: var(--correct); }
  .toggle-hint { font-size: 11px; color: var(--muted); padding: 8px 4px 0; }

  /* ---------- Mobile topbar ---------- */
  .topbar {
    display: none;
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    align-items: center;
    gap: 12px;
  }
  .menu-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    width: 38px; height: 38px;
    font-size: 18px;
    cursor: pointer;
  }
  .topbar-title { font-weight: 600; font-size: 15px; }
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 90;
  }

  /* ---------- Main ---------- */
  .main {
    margin-left: var(--sidebar-w);
    padding: 40px 48px 80px;
    max-width: calc(var(--sidebar-w) + 900px);
  }
  .page { display: none; }
  .page.active { display: block; }

  .page-head { margin-bottom: 28px; }
  .page-tag {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .page[data-ch="1"] .page-tag { background: rgba(242, 120, 75, 0.15); color: var(--ch1); }
  .page[data-ch="2"] .page-tag { background: rgba(90, 169, 230, 0.15); color: var(--ch2); }
  .page[data-ch="3"] .page-tag { background: rgba(179, 131, 232, 0.15); color: var(--ch3); }
  .page-head h1 { font-size: 24px; font-weight: 700; line-height: 1.4; }
  .page-head p { color: var(--muted); font-size: 14px; margin-top: 6px; }

  /* ---------- Question card ---------- */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 14px;
    border-left: 4px solid var(--border);
  }
  .page[data-ch="1"] .q-card { border-left-color: var(--ch1); }
  .page[data-ch="2"] .q-card { border-left-color: var(--ch2); }
  .page[data-ch="3"] .q-card { border-left-color: var(--ch3); }
  .q-title {
    display: flex;
    gap: 10px;
    font-weight: 600;
    font-size: 15.5px;
    margin-bottom: 14px;
  }
  .q-num {
    flex-shrink: 0;
    color: var(--muted);
    font-weight: 700;
    min-width: 26px;
  }
  .opts { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .opt {
    display: flex;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.02);
    font-size: 14.5px;
    transition: background 0.2s, border-color 0.2s;
  }
  .opt-num { color: var(--muted); flex-shrink: 0; min-width: 18px; }
  .opt.correct {
    background: var(--correct-bg);
    border-color: rgba(62, 207, 142, 0.4);
  }
  .opt.correct .opt-num, .opt.correct .opt-text { color: var(--correct); font-weight: 500; }
  .opt.correct::after { content: '✓'; margin-left: auto; color: var(--correct); font-weight: 700; padding-left: 8px; }
  .opt.placeholder .opt-text { color: var(--muted); font-style: italic; }

  .answer-box {
    padding: 11px 14px;
    border-radius: 8px;
    background: var(--correct-bg);
    border: 1px solid rgba(62, 207, 142, 0.4);
    color: var(--correct);
    font-weight: 500;
    font-size: 14.5px;
    transition: filter 0.2s;
  }
  .answer-box .lbl { font-size: 12px; opacity: 0.8; display: block; margin-bottom: 2px; font-weight: 600; }
  .answer-box .line { display: block; }

  .note {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    background: var(--note-bg);
    color: var(--note);
    font-size: 13px;
  }
  .star {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    background: rgba(90, 169, 230, 0.1);
    color: var(--accent);
    font-size: 13px;
    font-weight: 500;
  }

  /* table */
  .tbl-wrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 520px; }
  th, td { padding: 9px 12px; border: 1px solid var(--border); text-align: left; vertical-align: top; }
  th { background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12.5px; }
  td:first-child { font-weight: 600; white-space: nowrap; }
  tr.hl td { background: rgba(179, 131, 232, 0.12); }

  /* ---------- Hide answers mode ---------- */
  body.hide-ans .q-card:not(.revealed) .opt.correct {
    background: rgba(255, 255, 255, 0.02);
    border-color: transparent;
  }
  body.hide-ans .q-card:not(.revealed) .opt.correct .opt-num { color: var(--muted); font-weight: 400; }
  body.hide-ans .q-card:not(.revealed) .opt.correct .opt-text { color: var(--text); font-weight: 400; }
  body.hide-ans .q-card:not(.revealed) .opt.correct::after { content: ''; }
  body.hide-ans .q-card:not(.revealed) .answer-box,
  body.hide-ans .q-card:not(.revealed) .tbl-wrap { filter: blur(6px); user-select: none; }
  body.hide-ans .q-card { cursor: pointer; }
  body.hide-ans .q-card:not(.revealed):hover { background: var(--card-hover); }

  /* ---------- Responsive ---------- */
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    body.nav-open .sidebar { transform: translateX(0); }
    body.nav-open .overlay { display: block; }
    .topbar { display: flex; }
    .main { margin-left: 0; padding: 24px 16px 60px; }
    .page-head h1 { font-size: 20px; }
    .q-card { padding: 16px; }
  }
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-title">항공안전</div>
  <div class="sidebar-sub">2026학년도 2학기 · 시험 대비 문제 정리</div>

  <a class="home-btn" href="https://johnyejin.github.io/maintenance/">⌂ 홈으로</a>

  <div class="nav-label">챕터</div>
  <nav id="nav"></nav>

  <div class="toggle-wrap">
    <button class="toggle-btn" id="toggleAns">정답 가리기</button>
    <div class="toggle-hint">가린 상태에서 문제 카드를 누르면 그 문제 정답만 보여요.</div>
  </div>
</aside>

<div class="overlay" id="overlay"></div>

<header class="topbar">
  <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">☰</button>
  <span class="topbar-title" id="topbarTitle">항공안전</span>
</header>

<main class="main" id="main"></main>

<script>
const CHAPTERS = [
  {
    id: 'workshop',
    ch: 1,
    title: '작업장, 운항정비 안전 / 화재예방',
    desc: '작업장 안전 · 공작기계 · 청력보호 · FOD · 화재 분류와 소화기',
    questions: [
      { q: '교대 근무 시 퇴근조가 수행해야 하는 정비 작업장 관리 수칙으로 옳은 것은?',
        opts: ['격납고 내 안전 통로는 필요 시에만 임시 표시한다', '위험 표시는 작업자만 알아볼 수 있게 작게 게시한다', '사용한 전기 코드는 그대로 통로에 연결해 둔다', '공용 공구통과 작업대가 적절히 보관되어 있는지 확인한다'], ans: 3 },
      { q: '전기 정비 작업 시 전기 화재 예방을 위한 대책으로 가장 적절한 것은?',
        opts: ['전선을 구부려 이동 통로 중앙에 배치한다', '작업장 주변에 가연성 물질을 제거한다', '단락 손상을 유도하여 열 발생을 방지한다', '피복 손상 장비는 계속 사용한다'], ans: 1 },
      { q: '고압가스 취급 및 타이어 정비 작업 시 준수해야 할 안전 수칙으로 옳은 것은?',
        opts: ['동료 작업자의 작업 지역을 향해 고압 공기를 분사한다', '작업 종료 후 공기 호스는 촘촘하게 꺾어서 보관한다', '무거운 타이어 장착 시 타이어 달리 등의 승강 장치를 사용한다', '작업복의 오염 물질은 고압 공기로 털어낸다'], ans: 2 },
      { q: '화학물질 유통 및 경보 표지의 국제적 통일을 위해 도입되어 시행 중인 제도는?',
        opts: ['ICAO 표준', 'GHS 제도', 'NFPA 기준', 'OSHA 안전 규정'], ans: 1 },
      { q: '화학물질 취급 시 물질안전보건자료(MSDS)에 대한 설명으로 옳은 것은?',
        opts: ['MSDS는 비공개 문서이므로 관리자만 보관하고 게시하지 않는다', '화학물질 취급자는 MSDS 교육을 이수할 필요는 없다', '화학물질로 인한 이상 발생 시 사업주 보고 없이 스스로 조치한다', '화학물질을 소분하여 사용할 때는 소분 용기에 경고 표지를 부착한다'], ans: 3 },
      { q: '공작기계를 이용한 드릴 작업 시 준수해야 할 안전 수칙으로 옳은 것은?',
        opts: ['깊은 구멍을 뚫을 때 드릴을 빼지 않고 계속 가공한다', '드릴이 박혀 멈추면 먼저 기계 전원을 정지시킨다', '가공할 물품은 손으로 잡아서 가공한다', '회전 중인 척을 손으로 잡아 회전을 빨리 멈춘다'], ans: 1 },
      { q: '선반 작업 중 발생할 수 있는 사고를 예방하기 위한 지침으로 올바른 것은?',
        opts: ['절삭 냉각액 사용을 최소화하거나 생략한다', '가공물의 치수를 측정할 때는 선반을 회전시킨 상태에서 실시한다', '작업 편의를 위해 작동 중인 선반 위에 자주 쓰는 공구를 얹어 놓는다', '회전 절삭 중 발생하는 칩 제거 시 전용 제거 공구를 사용한다'], ans: 3 },
      { q: '밀링 작업 시 올바른 작업 방법은?',
        opts: ['재료 절삭 중에 기계의 속도와 이송 비율을 변경한다', '재료는 심, 블록 및 클램프를 사용하여 고정한다', '작업대에서 벗어날 때 테이블을 올린 상태로 둔다', '커터 직경은 작업 조건과 관계없이 가장 큰 것을 골라 사용한다'], ans: 1 },
      { q: '연삭기 안전 관리 및 방호 장치 규정에 대한 설명으로 옳은 것은?',

      { q: '격납고 내부에서 항공기 용접 작업을 수행할 때 지켜야 하는 안전 요구 조건으로 옳지 않은 것은?',

        opts: ['고압가스 안전관리법에 따른 용기 등의 표시를 한 경우', '작업장에서 상시 사용하는 용기에 옮겨 담아 보관하는 경우', '양도·제공자가 이미 용기에 경고표시를 한 경우', '위험물안전관리법에 따른 위험물 운반용기에 관한 표시를 한 경우'], ans: 1,
        star: '소분해서 상시 사용하는 용기에도 경고표시 필요 (일시적으로 옮겨 담는 용기만 제외)' },
      { q: '경고표지 항목 중 유해·위험의 심각성 정도에 따라 "위험" 또는 "경고" 문구를 표시하는 항목은?',
        opts: ['그림문자', '예방조치 문구', '신호어', '유해·위험 문구'], ans: 2 },
      { q: 'GHS 그림문자 중 인체 실루엣(가슴에서 빛이 나는 사람 모양)이 상징하는 위험은?',
        answer: ['발암성, 생식독성, 유전독성, 호흡기 과민성, 장기 독성, 흡인 위험'],
        note: '보기는 녹음에 없음',
        star: '그림문자별 의미 알아둘 것 (선생님 강조)',
        table: true },
      { q: '사업장 내 MSDS 게시 및 비치 방법에 대한 설명으로 적절하지 않은 것은?',
        opts: ['유해성·위험성이 유사한 물질이라도 물질별로 개별 관리 요령만 게시해야 하며 그룹별 게시는 불가능하다', '안전사고 또는 직업병 발생 우려가 있는 장소에 게시한다', '취급 근로자가 쉽게 보거나 접근할 수 있는 장소에 게시하거나 갖춘다', '전산장비를 갖추어 취급 작업자가 쉽게 확인하도록 조치할 수 있다'], ans: 0 }
    ]
  }
];

const PICTOGRAMS = [
  ['폭발물', '폭발', '폭발성 물질, 자기반응성 물질, 유기과산화물'],
  ['불꽃', '불꽃', '인화성 가스·액체·고체, 자기반응성, 자연발화성, 자기발열성 물질'],
  ['산화제', '불꽃 위 원', '산화성 가스·액체·고체 (다른 물질 연소 촉진)'],
  ['가스 실린더', '가스통', '압축가스, 액화가스, 냉각액화가스'],
  ['부식', '손·금속에 액체', '피부 부식, 심한 눈 손상, 금속 부식성'],
  ['해골과 뼈', '해골', '급성 독성 (치명적)'],
  ['느낌표', '!', '피부·눈 자극, 피부 민감화, 급성 독성(경미), 호흡기 자극'],
  ['인체 실루엣', '가슴에서 빛나는 사람', '발암성, 생식독성, 유전독성, 호흡기 과민성, 장기 독성, 흡인 위험'],
  ['죽은 나무와 물고기', '나무·물고기', '수생환경 유해성 (급성·만성 독성)']
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function renderTable() {
  const rows = PICTOGRAMS.map(r =>
    `<tr${r[0] === '인체 실루엣' ? ' class="hl"' : ''}><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`
  ).join('');
  return `<div class="tbl-wrap"><table><thead><tr><th>그림문자</th><th>상징</th><th>의미</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderQuestion(item, i) {
  let body = '';
  if (item.opts) {
    body = '<ol class="opts">' + item.opts.map((o, k) => {
      const cls = ['opt'];
      if (k === item.ans) cls.push('correct');
      if (k === item.placeholder) cls.push('placeholder');
      return `<li class="${cls.join(' ')}"><span class="opt-num">${k + 1}.</span><span class="opt-text">${esc(o)}</span></li>`;
    }).join('') + '</ol>';
  } else if (item.answer) {
    body = `<div class="answer-box"><span class="lbl">정답</span>${item.answer.map(a => `<span class="line">${esc(a)}</span>`).join('')}</div>`;
  }
  if (item.table) body += renderTable();
  if (item.star) body += `<div class="star">★ ${esc(item.star)}</div>`;
  if (item.note) body += `<div class="note">${esc(item.note)}</div>`;
  return `<article class="q-card"><div class="q-title"><span class="q-num">${i + 1}</span><span>${esc(item.q)}</span></div>${body}</article>`;
}

function render() {
  const nav = document.getElementById('nav');
  const main = document.getElementById('main');
  nav.innerHTML = CHAPTERS.map(c =>
    `<a class="nav-link" href="#${c.id}" data-ch="${c.ch}" data-id="${c.id}"><span class="nav-num">${c.ch}</span>${esc(c.title)}<span class="nav-count">${c.questions.length}문제</span></a>`
  ).join('');
  main.innerHTML = CHAPTERS.map(c =>
    `<section class="page" id="page-${c.id}" data-ch="${c.ch}">
      <div class="page-head">
        <span class="page-tag">CHAPTER ${c.ch} · ${c.questions.length}문제</span>
        <h1>${esc(c.title)}</h1>
        <p>${esc(c.desc)}</p>
      </div>
      ${c.questions.map(renderQuestion).join('')}
    </section>`
  ).join('');
}

function showPage() {
  const hash = location.hash.replace('#', '');
  const chapter = CHAPTERS.find(c => c.id === hash) || CHAPTERS[0];
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + chapter.id));
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.id === chapter.id));
  document.getElementById('topbarTitle').textContent = chapter.ch + '. ' + chapter.title;
  document.title = chapter.title + ' · 항공안전';
  document.body.classList.remove('nav-open');
  window.scrollTo(0, 0);
}

render();
if (!location.hash) history.replaceState(null, '', '#' + CHAPTERS[0].id);
showPage();
window.addEventListener('hashchange', showPage);

// mobile sidebar
document.getElementById('menuBtn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
document.getElementById('overlay').addEventListener('click', () => document.body.classList.remove('nav-open'));

// hide answers mode
const toggleBtn = document.getElementById('toggleAns');
toggleBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('hide-ans');
  toggleBtn.textContent = on ? '정답 보이기' : '정답 가리기';
  document.querySelectorAll('.q-card.revealed').forEach(c => c.classList.remove('revealed'));
});
document.getElementById('main').addEventListener('click', e => {
  if (!document.body.classList.contains('hide-ans')) return;
  const card = e.target.closest('.q-card');
  if (card) card.classList.toggle('revealed');
});
</script>
</body>
</html>
